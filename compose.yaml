name: learning-assistant

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: assistant
      POSTGRES_USER: ${ASSISTANT_DB_USER:-assistant}
      POSTGRES_PASSWORD: ${ASSISTANT_DB_PASSWORD:?Set ASSISTANT_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - assistant-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      ASSISTANT_BIND: 0.0.0.0
      ASSISTANT_PORT: "8080"
      ASSISTANT_DB_URL: jdbc:postgresql://postgres:5432/assistant
      ASSISTANT_DB_USER: ${ASSISTANT_DB_USER:-assistant}
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:?Set ASSISTANT_DB_PASSWORD}
      ASSISTANT_DOCUMENTS: /learning-materials
      ASSISTANT_SECURE_COOKIE: ${ASSISTANT_SECURE_COOKIE:-false}
    ports:
      - "127.0.0.1:${ASSISTANT_PORT:-8080}:8080"
    volumes:
      - type: bind
        source: ${ASSISTANT_DOCUMENTS_DIR:-./learning-materials}
        target: /learning-materials
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 4s
      start_period: 25s
      retries: 6
    stop_grace_period: 70s

volumes:
  assistant-db:
